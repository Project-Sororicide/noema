name: ${project.name}
version: ${project.version}
main: dev.pupwired.noema.NoemaPlugin
api-version: '26.3'
description: Lightweight, low-overhead NPCs for high-density population.

commands:
  noema:
    description: Noema admin command
    usage: /noema <reload|place|remove>
    permission: noema.admin

permissions:
  noema.admin:
    description: Reload Noema configuration
    default: op
